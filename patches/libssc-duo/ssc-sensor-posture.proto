syntax = "proto2";

/*
 * Device posture event (Surface Duo, sns_posture_event, msg id 7788).
 * @state: -1 unknown, 0 closed, 1 peek right, 2 peek left, 3 read, 4 compose, 5 open dual portrait, 6 open dual landscape,
 *         7 brochure right, 8 tent right, 9 flip portrait right, 10 flip landscape right, 11 flip portrait left,
 *         12 flip landscape left, 13 brochure left, 14 tent left, 15 ramp right, 16 ramp left, 99 undetermined.
 */
message SscPostureResponse {
	required int32 state = 1;
}

/* Same sensor reported as standard sensor event (msg id 1025): value in data[0]. */
message SscPostureStdEvent {
	repeated float data = 1;
	required int32 accuracy = 2;
}
