# Surface Duo: ohne ACP legt PipeWire fuer jedes DSP-PCM-Geraet eine Senke an (~40). Nur MultiMedia1 (hw:0,0) freigeben.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*tavil.*" } { node.name = "~alsa_input.*tavil.*" } ]
    actions = { update-props = { node.disabled = true } }
  }
  {
    matches = [ { node.name = "~alsa_output.*tavil.playback.0.0" } ]
    actions = { update-props = {
      node.disabled = false
      node.description = "Surface Duo Lautsprecher"
      node.nick = "Lautsprecher"
      priority.session = 2000
      priority.driver = 2000
    } }
  }
]
