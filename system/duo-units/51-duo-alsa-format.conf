# Surface Duo (sm8150-tavil-snd-card): via msm-pcm the Qualcomm DSP (ASM) only accepts the Android format 16 bit / 48 kHz
# (32-bit open -> ADSP_EFAILED opcode 0x10BCD). Hence PipeWire is pinned to S16LE/48000/2.
# msm-pcm delivers data through a copy callback (msm_pcm_playback_copy): mmap access -> silence. Hence disable-mmap.
monitor.alsa.rules = [
  {
    # Card: NO ACP profile probing (opens with S32 -> ADSP_EFAILED, leaves the card lock held -> card blocked)
    matches = [ { device.name = "~alsa_card.platform-soc_qcom_msm-audio-apr_sound-tavil.*" } ]
    actions = { update-props = { api.alsa.use-acp = false, api.acp.auto-profile = false, api.acp.auto-port = false } }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-soc_qcom_msm-audio-apr_sound-tavil.*" } ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
        api.alsa.disable-mmap = true
        api.alsa.disable-batch = true
        api.alsa.use-chmap = false
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_input.platform-soc_qcom_msm-audio-apr_sound-tavil.*" } ]
    actions = { update-props = { audio.format = "S16LE", audio.rate = 48000, api.alsa.disable-mmap = true } }
  }
]
