# greetd on the Duo like gdm: after audio, splash screen removed first (gdm.service.d/duo-splash.conf, duo-env.conf).
[Unit]
After=duo-audio.service duo-splash.service duo-haltung.service
[Service]
ExecStartPre=-/usr/bin/systemctl stop duo-splash.service
Environment=MESA_LOADER_DRIVER_OVERRIDE=zink GSK_RENDERER=vulkan TU_DEBUG=sysmem,nolrz,noubwc
