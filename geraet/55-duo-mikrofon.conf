# Surface Duo: built-in microphone (DMIC2 via MultiMedia1 capture, hw:0,0), path: duo-mixer-mic.sh (05.11.2026).
# The DSP only accepts 16 bit / 48 kHz; mono, because the path delivers one channel (SLIM_0_TX One).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_input.*tavil.capture.0.0" } ]
    actions = { update-props = {
      node.disabled = false
      node.description = "Surface Duo Mikrofon"
      node.nick = "Mikrofon"
      priority.session = 2000
      priority.driver = 2000
      audio.format = "S16LE"
      audio.rate = 48000
      audio.channels = 1
      audio.position = [ MONO ]
      api.alsa.disable-mmap = true
      api.alsa.disable-batch = true
      api.alsa.use-chmap = false
    } }
  }
]
