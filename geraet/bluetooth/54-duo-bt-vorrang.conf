# Surface Duo: prefer connected Bluetooth speakers/headphones over the built-in speakers (priority.session 2000).
# On disconnect, sound falls back to the Duo automatically. 31.10.2026
monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = { update-props = { priority.session = 2500, priority.driver = 2500 } }
  }
]
